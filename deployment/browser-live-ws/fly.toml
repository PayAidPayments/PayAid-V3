# Fly.io app for browser live voice WSS sidecar.
# Create app: fly apps create payaid-browser-live-ws
# Set secrets: fly secrets set DATABASE_URL=… JWT_SECRET=… GROQ_API_KEY=…
# Deploy: fly deploy --config deployment/browser-live-ws/fly.toml

app = "payaid-browser-live-ws"
primary_region = "sin"

[build]
  dockerfile = "deployment/browser-live-ws/Dockerfile"

[env]
  VOICE_LIVE_WS_PORT = "3002"
  NODE_ENV = "production"
  PAYAID_CLI_SCRIPT = "1"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
