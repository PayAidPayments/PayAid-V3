# Render Blueprint — browser live voice WSS sidecar (M1).
# Dashboard: New → Blueprint → connect repo → path: deployment/browser-live-ws/render.yaml
# Or: npm run voice-agent:deploy-browser-live-render (with RENDER_API_KEY)

services:
  - type: web
    name: payaid-browser-live-ws
    runtime: docker
    dockerfilePath: deployment/browser-live-ws/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYAID_CLI_SCRIPT
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
